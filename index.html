<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendataan</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .form-container { background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #333; border-bottom: 2px solid #007BFF; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input[type="text"], input[type="date"], input[type="tel"], input[type="email"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        /* Style untuk Radio Buttons (Jenis Transaksi) */
        .radio-group { display: flex; gap: 15px; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; cursor: pointer; }
        .radio-group input[type="radio"] { margin-right: 5px; width: auto; }
        
        .btn-submit {
            background-color: #007BFF; color: white; border: none; padding: 12px 20px; width: 100%;
            border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 20px;
        }
        .btn-submit:hover { background-color: #0056b3; }
        .loading { display: none; text-align: center; margin-top: 15px; color: #007BFF; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <form name="submit-to-google-sheet" id="dataForm">
        
        <h2>Data Demografi</h2>
        <div class="form-group">
            <label>Nama Pengguna</label>
            <input type="text" name="Nama" required>
        </div>
        <div class="form-group">
            <label>Tanggal Lahir</label>
            <input type="date" name="Tanggal Lahir" required>
        </div>
        <div class="form-group">
            <label>Alamat</label>
            <textarea name="Alamat" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>No Telepon</label>
            <input type="tel" name="No Telepon" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="Email" required>
        </div>
        <div class="form-group">
            <label>Pendidikan (Ketik untuk mencari)</label>
            <input list="pendidikan-list" name="Pendidikan" required placeholder="Pilih atau cari...">
            <datalist id="pendidikan-list">
                <option value="SD">
                <option value="SMP">
                <option value="SMA/SMK">
                <option value="Diploma (D3)">
                <option value="Sarjana (S1)">
                <option value="Magister (S2)">
                <option value="Doktor (S3)">
            </datalist>
        </div>

        <h2>Data Bank</h2>
        <div class="form-group">
            <label>Nama Bank (Ketik untuk mencari)</label>
            <input list="bank-list" name="Bank" required placeholder="Pilih atau cari bank...">
            <datalist id="bank-list">
                <option value="Bank Mandiri">
                <option value="Bank BCA">
                <option value="Bank BNI">
                <option value="Bank BRI">
                <option value="Bank Syariah Indonesia (BSI)">
                <option value="Bank CIMB Niaga">
            </datalist>
        </div>
        <div class="form-group">
            <label>Nomor Rekening</label>
            <input type="number" name="No Rekening" required>
        </div>

        <h2>Data Transaksi Keuangan</h2>
        <div class="form-group">
            <label>Tanggal Transaksi</label>
            <input type="date" name="Tgl Transaksi" required>
        </div>
        <div class="form-group">
            <label>Uraian Transaksi</label>
            <input type="text" name="Uraian" required>
        </div>
        <div class="form-group">
            <label>Jenis Transaksi</label>
            <div class="radio-group">
                <label><input type="radio" name="Jenis Transaksi" value="Pemasukan" required> Pemasukan</label>
                <label><input type="radio" name="Jenis Transaksi" value="Pengeluaran"> Pengeluaran</label>
            </div>
        </div>
        <div class="form-group">
            <label>Debet (Rp)</label>
            <input type="number" name="Debet" value="0">
        </div>
        <div class="form-group">
            <label>Kredit (Rp)</label>
            <input type="number" name="Kredit" value="0">
        </div>

        <button type="submit" class="btn-submit">Simpan Data</button>
        <div class="loading" id="loadingMsg">Menyimpan data ke sistem...</div>
    </form>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwECrG_uZLcRdnlfeF6djrcwyPMFsdJuR4lgKFM3TBFITZ1XA9xx3_IEJfgTWZ0XZLT5A/exec';
  const form = document.forms['submit-to-google-sheet'];
  const loading = document.getElementById('loadingMsg');
  const btnSubmit = document.querySelector('.btn-submit');

  form.addEventListener('submit', e => {
    e.preventDefault();
    loading.style.display = 'block';
    btnSubmit.disabled = true;
    
    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => {
        loading.style.display = 'none';
        btnSubmit.disabled = false;
        alert('Data berhasil disimpan ke Google Sheets!');
        form.reset(); // Mengosongkan form setelah berhasil
      })
      .catch(error => {
        loading.style.display = 'none';
        btnSubmit.disabled = false;
        alert('Terjadi kesalahan! Coba lagi.');
        console.error('Error!', error.message);
      })
  });
</script>

</body>
</html>
