<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajian Data Dashboard</title>
    <style>
        /* CSS Reset Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Styling Body (Latar Belakang & Font) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* Styling Bagian Judul (Header) */
        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1000px;
            padding-top: 20px;
        }

        header h1 {
            color: #1a365d;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: #4a5568;
            font-size: 1.1rem;
        }

        /* Container untuk membungkus Iframe agar responsif */
        .dashboard-container {
            width: 100%;
            max-width: 1000px; /* Batas lebar maksimal di PC */
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            
            /* Membuat tinggi responsif menyesuaikan layar */
            height: 75vh; 
            min-height: 500px;
            position: relative;
            border: 1px solid #e2e8f0;
        }

        /* Menyesuaikan Iframe agar memenuhi container */
        .dashboard-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Styling Footer */
        footer {
            margin-top: 30px;
            text-align: center;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        /* Responsivitas tambahan untuk layar HP */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            .dashboard-container {
                border-radius: 8px;
                height: 60vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Laporan Data Interaktif</h1>
        <p>Sajian visualisasi data terkini dari Google Data Studio</p>
    </header>

    <div class="dashboard-container">
        <iframe 
            src="https://datastudio.google.com/embed/reporting/2e1e608a-6f49-4db2-9d21-30794027acf7/page/page_12345" 
            frameborder="0" 
            style="border:0" 
            allowfullscreen 
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <footer>
        &copy; 2026 Sajian Data. Dihosting melalui GitHub Pages.
    </footer>

</body>
</html>
